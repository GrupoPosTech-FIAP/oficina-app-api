# MODELO do Secret do ambiente AWS (EKS + RDS).
# Copie para secret.yaml e preencha com os valores REAIS em base64:
#   cp secret.example.yaml secret.yaml
#
# Gere os valores base64 assim (nao inclua quebra de linha):
#   echo -n 'sua-senha-do-rds' | base64
#   echo -n 'seu-jwt-secret'    | base64
#
# O secret.yaml real esta no .gitignore e NAO deve ser commitado.
# Em CI/CD, este arquivo e gerado a partir dos GitHub Secrets (ver docs).
apiVersion: v1
kind: Secret
metadata:
  name: oficina-secret
type: Opaque
stringData:
  JWT_SECRET: "${JWT_SECRET}"
  SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD}"