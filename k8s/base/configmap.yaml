# ConfigMap é usado para armazenar dados de configuração não sensíveis, como URLs, nomes de usuário, etc. Ele é útil para separar a configuração do código da aplicação, permitindo que você altere a configuração sem precisar reconstruir a imagem do contêiner. Para criar um ConfigMap, você pode usar o seguinte comando:
apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-config
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/oficina_db
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_PROFILES_ACTIVE: prod
  # Observabilidade (ADR 002 da app-api): agente OpenTelemetry exportando por OTLP para o New Relic.
  # A license key (OTEL_EXPORTER_OTLP_HEADERS) e o liga/desliga (OTEL_SDK_DISABLED) vêm do Secret.
  OTEL_SERVICE_NAME: oficina-api
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=oficina
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_ENDPOINT: https://otlp.nr-data.net:4318
