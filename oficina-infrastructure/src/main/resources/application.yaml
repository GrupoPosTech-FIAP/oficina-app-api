spring:
  application:
    name: oficina-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/oficina_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Use 'update' apenas em dev. Em prod, use Flyway e mude para 'validate'
      ddl-auto: update
    show-sql: true # Mostra os SQLs no console para debugar
    properties:
      hibernate:
        format_sql: true
  task:
    scheduling:
      pool:
        # relay da outbox + consumidor SQS (long polling) não podem disputar a mesma thread
        size: 2
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    test-connection: false
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  health:
    # O MailHealthIndicator abre uma conexao SMTP com o Gmail a cada chamada de
    # /actuator/health. No EKS isso estoura o timeout da probe e derruba o pod
    # (503 -> CrashLoopBackOff). A disponibilidade do e-mail nao deve gatilhar a
    # saude do pod, entao desligamos esse indicador.
    mail:
      enabled: false

jwt:
  secret: ${JWT_SECRET:c2VjcmV0b0p3dFN1cGVyU2VndXJvUGFyYU9maWNpbmFBcGkxMjM0NTY3ODk=}
  expiration: 86400000

webhook:
  secret: ${WEBHOOK_SECRET:webhookSecretPadraoOficinaApi123456}

# Mensageria da Saga (ADR 005). Desligada por padrão: os eventos são gravados na outbox,
# mas só saem do serviço com MENSAGERIA_HABILITADA=true.
mensageria:
  habilitada: ${MENSAGERIA_HABILITADA:false}
  produtor: oficina-app-api
  topico-arn: ${MENSAGERIA_TOPICO_ARN:}
  fila-url: ${MENSAGERIA_FILA_URL:}
  regiao: ${AWS_REGION:us-east-1}
  # LocalStack em dev (ex.: http://localhost:4566); vazio usa a AWS
  endpoint: ${MENSAGERIA_ENDPOINT:}
